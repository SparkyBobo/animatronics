[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"


[project]
name = "animacy"
version = "0.1.0"
description = "Animacy framework for animatronic show control"
requires-python = ">=3.9"

dependencies = [
    "umidiparser",
    "adafruit-circuitpython-midi",
    "adafruit-circuitpython-pioasm"
]


[project.optional-dependencies]
test = [
    "pytest",
    "mido",
]


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
pythonpath = [
    "lib",
    "src",
    "shims",
]


[tool.black]
line-length = 88

[tool.setuptools.package-data]
animacy = ["log_strings.txt"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
ignore = [
    "E501",
]
